name: Package and upload

# develop push: uploads an alpha.
# main push (a merged PR): tags the top CHANGELOG.md version if it is new and uploads it as a release.
# Tag push (manual, e.g. 1.2.0-beta1): uploads as beta/alpha/release by the tag name.
on:
  push:
    branches:
      - develop
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          # The packager needs the full tag history to name builds and diff changelogs.
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN doesn't start another workflow run, so the release is
      # tagged and uploaded here in the same run.
      - name: Tag release on main
        id: autotag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          version="$(awk '/^## /{ print $2; exit }' CHANGELOG.md)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Top CHANGELOG.md section has no x.y.z version: '$version'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # On develop, a tagged head means a tag was pushed with it, and that tag's run uploads it.
      # On main, only a commit tagged above in this run is uploaded here; any other tag got its own run.
      - name: Decide upload
        id: decide
        run: |
          upload=true
          if [[ "${{ github.ref_name }}" == "develop" ]] && git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            upload=false
          fi
          if [[ "${{ github.ref_name }}" == "main" && "${{ steps.autotag.outputs.tagged }}" != "true" ]]; then
            upload=false
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

      # CurseForge gets only this build's changes plus a link to the full CHANGELOG.md, which
      # ships in the zip. The dotfile name keeps the packager from shipping this one.
      - name: Write CurseForge changelog
        if: steps.decide.outputs.upload == 'true'
        run: |
          {
            if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
              awk '/^## /{ section++ } section == 1' CHANGELOG.md
            else
              lastTag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              echo "Alpha build. Commits since ${lastTag:-the first commit}:"
              echo
              git log --no-merges --format='- %s' "${lastTag:+$lastTag..}HEAD"
            fi
            echo
            echo "[Full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > .changelog-latest.md

      - name: Package and upload
        if: steps.decide.outputs.upload == 'true'
        uses: BigWigsMods/packager@v2
