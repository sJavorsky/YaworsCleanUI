name: Package and upload

# develop push: uploads an alpha.
# main push (a merged PR): tags the top CHANGELOG.md version if it is new, then starts a run on that tag.
# Tag push or a run started on a tag: uploads as beta/alpha/release by the tag name.
on:
  push:
    branches:
      - develop
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          # The packager needs the full tag history to name builds and diff changelogs.
          fetch-depth: 0

      # The packager refuses to build a branch push whose head is tagged, and a tag pushed with
      # GITHUB_TOKEN starts no run of its own. A workflow_dispatch is the one event this token
      # can start, so the release is packaged by a new run on the tag.
      - name: Tag release on main
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk '/^## /{ print $2; exit }' CHANGELOG.md)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Top CHANGELOG.md section has no x.y.z version: '$version'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          gh workflow run release.yml --ref "$version"

      # CurseForge gets only this build's changes plus a link to the full CHANGELOG.md, which
      # ships in the zip. The dotfile name keeps the packager from shipping this one.
      - name: Write CurseForge changelog
        if: github.ref_name != 'main'
        run: |
          {
            if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
              awk '/^## /{ section++ } section == 1' CHANGELOG.md
            else
              lastTag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              echo "Alpha build. Commits since ${lastTag:-the first commit}:"
              echo
              git log --no-merges --format='- %s' "${lastTag:+$lastTag..}HEAD"
            fi
            echo
            echo "[Full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > .changelog-latest.md

      # Skips a develop push whose head is tagged by itself; that tag's run uploads it.
      - name: Package and upload
        if: github.ref_name != 'main'
        uses: BigWigsMods/packager@v2
